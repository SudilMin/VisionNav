# robot_localization EKF for outdoor GPS fusion
ekf_filter_node:
  ros__parameters:
    frequency: 30.0
    two_d_mode: true
    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom

    # Fuse LiDAR SLAM odometry (high-rate, accurate locally)
    odom0: /odom
    odom0_config: [true, true, false,    # x, y, z
                   false, false, true,    # roll, pitch, yaw
                   false, false, false,   # vx, vy, vz
                   false, false, false,   # vroll, vpitch, vyaw
                   false, false, false]   # ax, ay, az

# Navsat transform: converts GPS lat/lon to map frame odometry
navsat_transform_node:
  ros__parameters:
    frequency: 10.0
    delay: 3.0  # Wait for GPS to stabilize
    magnetic_declination_radians: 0.0
    yaw_offset: 0.0
    zero_altitude: true
    broadcast_utm_transform: true
    publish_filtered_gps: true
    use_odometry_yaw: true  # Trust LiDAR yaw over GPS heading
    wait_for_datum: false

